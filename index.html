const NOTE_STOPWORDS = new Set([
  "그리고", "그러나", "그래서", "정말", "너무", "진짜", "아주", "매우", "같아요", "싶어요", "합니다", "입니다",
  "있어요", "해요", "조금", "항상", "자주", "그냥", "약간", "엄청", "완전", "등등", "등", "걸", "것", "거",
  "수", "때", "좀", "막", "또", "그", "저", "나", "제가", "저는", "그는", "그녀는", "이런", "저런", "그런",
  "하는", "하고", "하지만", "때문에", "위해", "위한", "대한", "대해", "정도", "사람", "성격",
]);
function extractKeywords(note) {
  if (!note) return [];
  const tokens = note
    .replace(/[.,!?~^ㅋㅎㅠㅜ:;()"'\n\r]+/g, " ")
    .split(/\s+/)
    .map((t) => t.trim())
    .filter((t) => t.length >= 2 && !NOTE_STOPWORDS.has(t));
  return Array.from(new Set(tokens)).slice(0, 8);
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function shuffled(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function genRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
function relKey(a, b) {
  return [a, b].sort().join("|");
}
function statusFromScore(score, currentStatus) {
  if (currentStatus === "부모자식" || currentStatus === "형제자매" || currentStatus === "가족") return currentStatus;
  if (currentStatus === "결혼") return "결혼";
  if (currentStatus === "연인") return "연인";
  if (score >= 70) return "절친";
  if (score >= 30) return "친구";
  if (score <= -30) return "앙숙";
  return "지인";
}
function statusColor(status) {
  switch (status) {
    case "부모자식":
      return "var(--family)";
    case "형제자매":
      return "var(--family)";
    case "가족":
      return "var(--family)";
    case "결혼":
      return "var(--marriage)";
    case "연인":
      return "var(--love)";
    case "절친":
      return "var(--gold)";
    case "친구":
      return "var(--good)";
    case "앙숙":
      return "var(--warn)";
    default:
      return "var(--ink-soft)";
  }
}

function MoaIslandSim() {

  const [islandName, setIslandName] = useState("");
  const [characters, setCharacters] = useState([]);
  const [relationships, setRelationships] = useState({});
  const [eventLog, setEventLog] = useState([]);
  const [newsLog, setNewsLog] = useState([]);
  const [turn, setTurn] = useState(0);
  const [autoPlay, setAutoPlay] = useState(false);
  const [pendingRequests, setPendingRequests] = useState([]);
  const [namingBaby, setNamingBaby] = useState(null);
  const [babyNameInput, setBabyNameInput] = useState("");
  const [showHelp, setShowHelp] = useState(false);
  const [selectedCharId, setSelectedCharId] = useState(null);

  const [formName, setFormName] = useState("");
  const [formTypes, setFormTypes] = useState([]);
  const [formCustomType, setFormCustomType] = useState("");
  const [formSoc, setFormSoc] = useState(50);
  const [formEmo, setFormEmo] = useState(50);
  const [formNote, setFormNote] = useState("");
  const [formAge, setFormAge] = useState(20);

  const [assigningJob, setAssigningJob] = useState(null);
  const [jobInput, setJobInput] = useState("");

  const [setupAId, setSetupAId] = useState("");
  const [setupBId, setSetupBId] = useState("");
  const [setupStatus, setSetupStatus] = useState("지인");

  const [talkTargetId, setTalkTargetId] = useState("");
  const [talkMessage, setTalkMessage] = useState("");

  const [giftTargetId, setGiftTargetId] = useState("");
  const [giftSecondTargetId, setGiftSecondTargetId] = useState("");
  const [godItems, setGodItems] = useState(DEFAULT_GOD_ITEMS);
  const [customItemIcon, setCustomItemIcon] = useState("🎁");
  const [customItemLabel, setCustomItemLabel] = useState("");
  const [customItemType, setCustomItemType] = useState("hunger");
  const [customItemAmount, setCustomItemAmount] = useState(30);
  const STORAGE_KEY = "moa-island-sim-save-v5";
  const LEGACY_SHARED_KEY = "moa-island-shared-state";
  const CAN_MULTIPLAYER = typeof window !== "undefined" && !!window.storage;
  const sharedKeyFor = (code) => "moa-island-room-" + (code || "default");
  const [storageLoaded, setStorageLoaded] = useState(false);
  const [multiplayerOn, setMultiplayerOn] = useState(false);
  const [roomCode, setRoomCode] = useState("");
  const [joinCodeInput, setJoinCodeInput] = useState("");
  const [importInput, setImportInput] = useState("");
  const [shareCopied, setShareCopied] = useState(false);
  const [codeCopied, setCodeCopied] = useState(false);
  const [exportCopied, setExportCopied] = useState(false);
  const [importError, setImportError] = useState(false);
  const [playerName, setPlayerName] = useState("");
  const [playerNameInput, setPlayerNameInput] = useState("");
  const [playerReady, setPlayerReady] = useState(true);
  const stateRef = React.useRef(null);

  // 예전 저장 데이터(성격 1개, 나이/세대/부모자식 없음)를 새 형식으로 자동 보정합니다.
  const migrateCharacter = (c) => ({
    ...c,
    personalityTypes: c.personalityTypes || (c.personalityType ? [c.personalityType] : ["평범한"]),
    age: c.age !== undefined ? c.age : (c.parentIds ? 0 : 20),
    generation: c.generation !== undefined ? c.generation : (c.parentIds ? 2 : 1),
    parentIds: c.parentIds !== undefined ? c.parentIds : null,
    job: c.job !== undefined ? c.job : null,
  });

  const applyLoadedData = (data) => {
    if (!data) return;
    if (data.islandName !== undefined) setIslandName(data.islandName);
    if (data.characters !== undefined) setCharacters(data.characters.map(migrateCharacter));
    if (data.relationships !== undefined) setRelationships(data.relationships);
    if (data.eventLog !== undefined) setEventLog(data.eventLog);
    if (data.newsLog !== undefined) setNewsLog(data.newsLog);
    if (data.turn !== undefined) setTurn(data.turn);
    if (data.pendingRequests !== undefined) setPendingRequests(data.pendingRequests);
    if (data.namingBaby !== undefined) setNamingBaby(data.namingBaby);
    if (data.babyNameInput !== undefined) setBabyNameInput(data.babyNameInput);
    if (data.assigningJob !== undefined) setAssigningJob(data.assigningJob);
    if (data.jobInput !== undefined) setJobInput(data.jobInput);
    if (data.godItems !== undefined) setGodItems(data.godItems);
  };

  // [1] 시작할 때는 항상 내 기기에 저장된 개인 섬을 먼저 불러옵니다 (기본값 = 싱글플레이).
  // 링크에 방 코드(?room=)가 붙어 있으면 그 방으로 자동 참가합니다.
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) applyLoadedData(JSON.parse(raw));
      const savedName = localStorage.getItem("moa-player-name-local");
      if (savedName) setPlayerName(savedName);
    } catch (e) {
      console.warn("저장 데이터 불러오기 실패:", e);
    } finally {
      setStorageLoaded(true);
    }
    try {
      let urlRoom = null;
      try {
        urlRoom = new URLSearchParams(window.location.search).get("room");
      } catch (e) {}
      if (CAN_MULTIPLAYER && urlRoom) {
        setRoomCode(urlRoom.toUpperCase());
        try {
          localStorage.setItem("moa-room-code", urlRoom.toUpperCase());
          localStorage.setItem("moa-multiplayer-on", "1");
        } catch (e) {}
        setMultiplayerOn(true);
      } else if (CAN_MULTIPLAYER && localStorage.getItem("moa-multiplayer-on") === "1") {
        const savedRoom = localStorage.getItem("moa-room-code");
        if (savedRoom) setRoomCode(savedRoom);
        setMultiplayerOn(true);
      }
    } catch (e) {}
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // 최신 상태를 ref에 담아둡니다 (멀티플레이 참여 시 초기 업로드에 사용).
  useEffect(() => {
    stateRef.current = {
      islandName, characters, relationships, eventLog, newsLog, turn,
      pendingRequests, namingBaby, babyNameInput, assigningJob, jobInput, godItems,
    };
  });

  // [2] 멀티플레이가 켜지면 이 방의 공유 데이터를 불러오거나(있으면), 없으면 지금 내 섬을 공유 섬으로 올립니다.
  // 이전 버전(방 코드가 없던 시절)에 쓰던 공유 데이터가 남아있다면 이어받아 기록이 끊기지 않게 합니다.
  useEffect(() => {
    if (!multiplayerOn || !CAN_MULTIPLAYER || !storageLoaded || !roomCode) return;
    let cancelled = false;
    const key = sharedKeyFor(roomCode);
    (async () => {
      try {
        const nameResult = await window.storage.get("moa-player-name", false);
        if (!cancelled && nameResult && nameResult.value) {
          setPlayerName(nameResult.value);
          setPlayerReady(true);
        } else if (!cancelled && !playerName) {
          setPlayerReady(false);
        }
      } catch (e) {}
      try {
        let shared = null;
        try {
          shared = await window.storage.get(key, true);
        } catch (e) {}
        if (!shared || !shared.value) {
          try {
            const legacy = await window.storage.get(LEGACY_SHARED_KEY, true);
            if (legacy && legacy.value) shared = legacy;
          } catch (e) {}
        }
        if (cancelled) return;
        if (shared && shared.value) {
          applyLoadedData(JSON.parse(shared.value));
        } else {
          await window.storage.set(key, JSON.stringify(stateRef.current || {}), true);
        }
      } catch (e) {}
    })();
    return () => {
      cancelled = true;
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [multiplayerOn, CAN_MULTIPLAYER, storageLoaded, roomCode]);

  // [3] 변경 사항 저장: 항상 내 기기에 백업하고, 멀티플레이 중이면 이 방의 공유 저장소에도 반영합니다.
  useEffect(() => {
    if (!storageLoaded) return;
    const payload = {
      islandName, characters, relationships, eventLog, newsLog, turn,
      pendingRequests, namingBaby, babyNameInput, assigningJob, jobInput, godItems,
    };
    (async () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) {
        console.warn("저장 데이터 기록 실패:", e);
      }
      if (multiplayerOn && CAN_MULTIPLAYER && roomCode) {
        try {
          await window.storage.set(sharedKeyFor(roomCode), JSON.stringify(payload), true);
        } catch (e) {
          console.warn("공유 데이터 기록 실패:", e);
        }
      }
    })();
  }, [storageLoaded, multiplayerOn, roomCode, islandName, characters, relationships, eventLog, newsLog, turn, pendingRequests, namingBaby, babyNameInput, assigningJob, jobInput, godItems]);

  // [4] 멀티플레이 중에는 다른 참가자가 만든 변화를 주기적으로 불러와 함께 반영합니다.
  useEffect(() => {
    if (!multiplayerOn || !CAN_MULTIPLAYER || !storageLoaded || !roomCode) return;
    const key = sharedKeyFor(roomCode);
    const id = setInterval(async () => {
      try {
        const shared = await window.storage.get(key, true);
        if (shared && shared.value) {
          const data = JSON.parse(shared.value);
          if (data.turn !== undefined && data.turn !== turn) {
            applyLoadedData(data);
          }
        }
      } catch (e) {}
    }, 4000);
    return () => clearInterval(id);
  }, [multiplayerOn, CAN_MULTIPLAYER, storageLoaded, roomCode, turn]);

    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      setCopiedFn(true);
      setTimeout(() => setCopiedFn(false), 2000);

  const step = () => {
    if (characters.length === 0) return;
    if (pendingRequests.length > 0 || namingBaby || assigningJob) return;

    const charsById = {};
    characters.forEach((c) => (charsById[c.id] = { ...c }));
    const relMap = {};
    Object.entries(relationships).forEach(([k, v]) => (relMap[k] = { ...v }));
    const log = [];
    const news = [...newsLog];
    const newRequests = [];
    const pendingSnapshot = pendingRequests;

    const getRel = (a, b) => relMap[relKey(a, b)] || { score: 0, status: "지인" };
    const setRel = (a, b, obj) => {
      relMap[relKey(a, b)] = obj;
    };
    const hasPendingFor = (type, x, y) =>
      pendingSnapshot.some((p) => p.type === type && ((p.aId === x && p.bId === y) || (p.aId === y && p.bId === x))) ||
      newRequests.some((p) => p.type === type && ((p.aId === x && p.bId === y) || (p.aId === y && p.bId === x)));

    const updateRelationshipStatus = (aId, bId) => {
      const a = charsById[aId];
      const b = charsById[bId];
      const r = getRel(aId, bId);
      const newStatus = statusFromScore(r.score, r.status);
      if (newStatus !== r.status) {
        setRel(aId, bId, { ...r, status: newStatus });
        log.push(`✨ [관계 변화] ${a.name}과(와) ${b.name}의 관계가 '${newStatus}'가 되었습니다!`);
      }
    };

    const interact = (aId, bId) => {
      const a = charsById[aId];
      const b = charsById[bId];
      const r = getRel(aId, bId);
      const compatibility = 1 - Math.abs(a.sociability - b.sociability);
      const luckyBonus = a.luckyTurns > 0 ? 0.2 : 0;
      const sharedInterests = (a.keywords || []).filter((k) => (b.keywords || []).includes(k));
      const interestBonus = sharedInterests.length > 0 ? 0.15 : 0;
      const successChance = 0.5 + r.score / 200 + compatibility * 0.2 - a.emotional * 0.1 + luckyBonus + interestBonus;

      a.loneliness = Math.max(0, a.loneliness - 30);
      b.loneliness = Math.max(0, b.loneliness - 20);

      if (Math.random() < successChance) {
        let delta = randInt(8, 15);
        let useTopic = false;
        let topic = null;
        if (sharedInterests.length > 0 && Math.random() < 0.5) {
          topic = sharedInterests[randInt(0, sharedInterests.length - 1)];
          delta += 5;
          useTopic = true;
        }
        const newScore = Math.min(100, r.score + delta);
        setRel(aId, bId, { ...r, score: newScore, status: r.status });
        log.push(
          useTopic
            ? `💫 ${a.name}와(과) ${b.name}는 서로 적어둔 '${topic}' 이야기로 더욱 가까워졌습니다! (호감도 +${delta} → 현재: ${newScore})`
            : `💬 ${a.name}가 ${b.name}에게 유쾌한 이야기를 건넸습니다. (호감도 +${delta} → 현재: ${newScore})`
        );
        updateRelationshipStatus(aId, bId);
        const r2 = getRel(aId, bId);
        if (r2.score >= 80 && !a.partner && !b.partner) {
          const cooldownOk = !(r2.confessCooldownUntilTurn && turn + 1 < r2.confessCooldownUntilTurn);
          if (cooldownOk && !hasPendingFor("confess", aId, bId) && Math.random() < 0.5) {
            newRequests.push({ id: `req-${Date.now()}-${Math.floor(Math.random() * 10000)}`, type: "confess", aId, bId });
            log.push(`❓ [신의 뜻을 묻습니다] ${a.name}가 ${b.name}에게 마음이 생겼어요. 사귀어도 될지 여쭤봅니다...`);
            setRel(aId, bId, { ...r2, confessCooldownUntilTurn: turn + 1 + REQUEST_COOLDOWN });
          }
        } else if (a.partner === bId && r2.status === "연인" && r2.score >= 90) {
          const cooldownOk = !(r2.marriageCooldownUntilTurn && turn + 1 < r2.marriageCooldownUntilTurn);
          if (cooldownOk && !hasPendingFor("marriage", aId, bId) && Math.random() < 0.35) {
            newRequests.push({ id: `req-${Date.now()}-${Math.floor(Math.random() * 10000)}`, type: "marriage", aId, bId });
            log.push(`❓ [신의 뜻을 묻습니다] ${a.name}와(과) ${b.name}가 결혼해도 될지 여쭤봅니다...`);
            setRel(aId, bId, { ...r2, marriageCooldownUntilTurn: turn + 1 + REQUEST_COOLDOWN });
          }
        }
      } else {
        const delta = randInt(8, 15);
        const newScore = Math.max(-100, r.score - delta);
        setRel(aId, bId, { ...r, score: newScore, status: r.status });
        log.push(`💥 ${a.name}와(과) ${b.name}가 성격 차이로 말다툼을 했습니다! (호감도 -${delta} → 현재: ${newScore})`);
        updateRelationshipStatus(aId, bId);
      }
    };

    const ids = characters.map((c) => c.id);
    const agesUp = (turn + 1) % TURNS_PER_AGE === 0;
    ids.forEach((id) => {
      const c = charsById[id];
      c.hunger = Math.min(100, c.hunger + randInt(5, 12));
      c.loneliness = Math.min(100, c.loneliness + randInt(5, 15));
      c.luckyTurns = Math.max(0, (c.luckyTurns || 0) - 1);
      if (agesUp) c.age = (c.age || 0) + 1;
      if (Math.random() < 0.05) {
        const eventFn = QUIRKY_EVENTS[randInt(0, QUIRKY_EVENTS.length - 1)];
        const text = eventFn(c.name);
        log.push(text);
        if (Math.random() < 0.4) news.push({ text, category: "other" });
      }
    });

    shuffled(ids).forEach((id) => {
      const c = charsById[id];
      if (c.hunger >= 75) {
        c.hunger -= 60;
        log.push(`🍛 ${c.name}가 식당에서 밥을 맛있게 먹었습니다.`);
        return;
      }
      if (c.loneliness >= 40 && Math.random() < c.sociability) {
        const others = ids.filter((x) => x !== id);
        if (others.length) {
          const targetId = others[randInt(0, others.length - 1)];
          interact(id, targetId);
        }
      }
    });

    const marriedPairs = [];
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const rr = getRel(ids[i], ids[j]);
        if (rr.status === "결혼") marriedPairs.push([ids[i], ids[j]]);
      }
    }
    shuffled(marriedPairs).forEach(([aId, bId]) => {
      const rr = getRel(aId, bId);
      if (rr.childCooldownUntilTurn && turn + 1 < rr.childCooldownUntilTurn) return;
      if (hasPendingFor("child", aId, bId)) return;
      if (Math.random() < 0.18) {
        const a = charsById[aId];
        const b = charsById[bId];
        newRequests.push({ id: `req-${Date.now()}-${Math.floor(Math.random() * 10000)}`, type: "child", aId, bId });
        log.push(`❓ [신의 뜻을 묻습니다] ${a.name}와(과) ${b.name}가 아이를 가져도 될지 여쭤봅니다...`);
        setRel(aId, bId, { ...rr, childCooldownUntilTurn: turn + 1 + REQUEST_COOLDOWN });
      }
    });

    setCharacters(ids.map((id) => charsById[id]));
    setRelationships(relMap);
    setNewsLog(news);
    setEventLog((prev) => [...log.reverse(), ...prev].slice(0, 100));
    setTurn((t) => t + 1);
    if (newRequests.length > 0) {
      setPendingRequests((prev) => [...prev, ...newRequests]);
    }
    const adultNeedingJob = ids.map((id) => charsById[id]).find((c) => c.age >= ADULT_AGE && c.job === null);
    if (adultNeedingJob) {
      setAssigningJob({ aId: adultNeedingJob.id, aName: adultNeedingJob.name });
      setJobInput("");
    }
  };

      const a = characters[i];
      const b = characters[j];
      const r = relationships[relKey(a.id, b.id)] || { score: 0, status: "지인" };
      pairList.push({ a, b, r });
    }
  }
  pairList.sort((x, y) => y.r.score - x.r.score);

  const marriageCount = pairList.filter((p) => p.r.status === "결혼").length;
  const romanceNews = newsLog.filter((n) => n.category === "romance");
  const otherNews = newsLog.filter((n) => n.category === "other");
  const babyCount = romanceNews.filter((n) => n.text.includes("2세 탄생")).length;

              </select>
            </div>
            <div className="god-item-grid">
              {godItems.map((item) => (
                <div className="god-item-card" key={item.id}>
                  {item.custom && (
                    <button className="item-remove" onClick={() => removeCustomItem(item.id)} type="button" aria-label="아이템 삭제">
                      ×
                    </button>
                  )}
                  <div className="god-item-icon">{item.icon}</div>
                  <div className="god-item-label">{item.label}</div>
                  <div className="god-item-desc">{item.desc}</div>
                  {item.needsTarget && (
                    <select className="god-select-small" value={giftSecondTargetId} onChange={(e) => setGiftSecondTargetId(e.target.value)}>
                      <option value="">상대 선택</option>
                      {characters
                        .filter((c) => c.id !== giftTargetId)
                        .map((c) => (
                          <option key={c.id} value={c.id}>
                            {c.name}
                          </option>
                        ))}
                    </select>
                  )}
                  <button
                    className="btn btn-ghost"
                    onClick={() => giveItem(item)}
                    disabled={!giftTargetId || (item.needsTarget && !giftSecondTargetId)}
                  >
                    선물하기
                  </button>
                </div>
              ))}
            </div>

            <div className="custom-item-form">
              <div className="custom-item-title">➕ 나만의 아이템 만들기</div>
              <input
                type="text"
                className="icon-input"
                value={customItemIcon}
                maxLength={2}
                onChange={(e) => setCustomItemIcon(e.target.value)}
                placeholder="🎁"
              />
              <input
                type="text"
                className="label-input"
                value={customItemLabel}
                maxLength={16}
                onChange={(e) => setCustomItemLabel(e.target.value)}
                placeholder="아이템 이름 (예: 딸기 케이크)"
              />
              <select value={customItemType} onChange={(e) => setCustomItemType(e.target.value)}>
                <option value="hunger">배고픔 감소</option>
                <option value="loneliness">외로움 감소</option>
                <option value="luck">행운 부여</option>
                <option value="relationship">호감도 상승 (상대 지정)</option>
                <option value="reconcile">화해 (상대 지정)</option>
              </select>
              {(customItemType === "hunger" || customItemType === "loneliness" || customItemType === "relationship") && (
                <input
                  type="number"
                  className="amount-input"
                  min="5"
                  max="100"
                  step="5"
                  value={customItemAmount}
                  onChange={(e) => setCustomItemAmount(Number(e.target.value))}
                />
              )}
              <button className="btn btn-accent" onClick={addCustomItem} disabled={!customItemLabel.trim()} type="button">
                아이템 추가
              </button>
            </div>
          </div>
        )}

        {characters.length >= 2 && (
          <div className="card">
            <div className="section-header-row">
              <h2 className="section-title">💞 {selectedChar ? `${selectedChar.name}의 관계` : "주민 관계도"}</h2>
              {selectedChar && (
                <button className="btn btn-ghost" onClick={() => setSelectedCharId(null)} type="button">
                  전체보기
                </button>
              )}
            </div>
            {displayedPairs.length === 0 ? (
              <div className="empty-state">아직 관계가 없어요.</div>
            ) : (
              <div className="rel-list">
                {displayedPairs.map(({ a, b, r }) => (
                  <div className="rel-item" key={`${a.id}-${b.id}`}>
                    <span className="rel-names">
                      {a.name} ↔ {b.name}
                    </span>
                    <span className="rel-badge" style={{ background: statusColor(r.status) }}>
                      {r.status}
                    </span>
                    <span className="rel-score">{r.score}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {romanceNews.length > 0 && (
          <div className="card">
            <h2 className="section-title">💕 연애 소식</h2>
            <div className="news-list">
              {[...romanceNews].reverse().map((n, i) => (
                <div className="news-line" key={i}>
                  {n.text}
                </div>
              ))}
            </div>
          </div>
        )}

        {otherNews.length > 0 && (
          <div className="card">
            <h2 className="section-title">📰 아일랜드 소식</h2>
            <div className="news-list">
              {[...otherNews].reverse().map((n, i) => (
                <div className="news-line other" key={i}>
                  {n.text}
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="card">
          <h2 className="section-title">📜 이벤트 로그</h2>
          {eventLog.length === 0 ? (
            <div className="empty-state">'다음 턴'을 눌러 시뮬레이션을 진행해보세요.</div>
          ) : (
            <div className="log-list">
              {eventLog.map((l, i) => (
                <div className="log-line" key={i}>
                  {l}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MoaIslandSim />);
</script>
</body>
</html>
