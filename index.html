function isAttractedTo(a, b) {
  const sameGender = a.gender === b.gender;
  const orientation = a.orientation || "hetero";
  if (orientation === "bi") return true;
  if (orientation === "homo") return sameGender;
  return !sameGender;
}
function mutuallyAttracted(a, b) {
  return isAttractedTo(a, b) && isAttractedTo(b, a);
}

function extractKeywords(note) {
  if (!note) return [];
  const tokens = note
    .replace(/[.,!?~^ㅋㅎㅠㅜ:;()"'\n\r]+/g, " ")
    .split(/\s+/)
    .map((t) => t.trim())
    .filter((t) => t.length >= 2 && !NOTE_STOPWORDS.has(t));
  return Array.from(new Set(tokens)).slice(0, 8);
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function shuffled(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function genRoomCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let code = "";
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}
function relKey(a, b) {
  return [a, b].sort().join("|");
}
const FAMILY_STATUSES = new Set(["부모자식", "형제자매", "가족"]);
function isFamilyStatus(status) {
  return FAMILY_STATUSES.has(status);
}
function statusFromScore(score, currentStatus) {
  if (currentStatus === "부모자식" || currentStatus === "형제자매" || currentStatus === "가족") return currentStatus;
  if (currentStatus === "이혼" || currentStatus === "이별" || currentStatus === "사별") return currentStatus;
  if (currentStatus === "결혼") return "결혼";
  if (currentStatus === "연인") return "연인";
  if (score >= 70) return "절친";
  if (score >= 30) return "친구";
  if (score <= -30) return "앙숙";
  return "지인";
}

  switch (status) {
    case "부모자식":

function dayOfYearAt(turnNumber) {
  const d = turnNumber % DAYS_PER_YEAR;
  return d === 0 ? DAYS_PER_YEAR : d;
}
function yearAt(turnNumber) {
  return Math.floor(turnNumber / DAYS_PER_YEAR) + 1;
}
const MONTH_DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
function monthDayToDayOfYear(month, day) {
  const m = Math.min(12, Math.max(1, Number(month) || 1));
  const maxDay = MONTH_DAYS[m - 1];
  const d = Math.min(maxDay, Math.max(1, Number(day) || 1));
  let doy = 0;
  for (let i = 0; i < m - 1; i++) doy += MONTH_DAYS[i];
  return doy + d;
}
function dayOfYearToMonthDay(doy) {
  let remaining = Math.min(DAYS_PER_YEAR, Math.max(1, doy || 1));
  for (let m = 0; m < 12; m++) {
    if (remaining <= MONTH_DAYS[m]) return { month: m + 1, day: remaining };
    remaining -= MONTH_DAYS[m];
  }
  return { month: 12, day: 31 };
}
function calendarAt(turnNumber, startYear) {
  const totalDays = Math.max(0, turnNumber);
  const yearOffset = Math.floor(totalDays / DAYS_PER_YEAR);
  const doy = (totalDays % DAYS_PER_YEAR) + 1;
  const { month, day } = dayOfYearToMonthDay(doy);
  return { year: (Number(startYear) || 1) + yearOffset, month, day, doy };
}
function relLabelFor(status) {
  if (status === "부모자식") return "부모";
  if (status === "형제자매") return "형제자매";
  if (status === "결혼" || status === "사별") return "배우자";
  if (status === "연인" || status === "이별") return "연인";
  if (status === "이혼") return "전 배우자";
  if (status === "절친") return "절친";
  return "지인";
}

    if (!multiplayerOn || !CAN_MULTIPLAYER || !storageLoaded || !roomCode) return;

      try {
        const nameResult = await window.storage.get("moa-player-name", false);

          setPlayerName(nameResult.value);
          setPlayerReady(true);
        } else if (!cancelled && !playerName) {
          setPlayerReady(false);
        }
      } catch (e) {}
      try {
        let shared = null;
        try {
          shared = await window.storage.get(key, true);
        } catch (e) {}
        if (!shared || !shared.value) {
          try {
            const legacy = await window.storage.get(LEGACY_SHARED_KEY, true);
            if (legacy && legacy.value) shared = legacy;
          } catch (e) {}
        }
        if (cancelled) return;
        if (shared && shared.value) {
          applyLoadedData(JSON.parse(shared.value));
        } else {
          await window.storage.set(key, JSON.stringify(stateRef.current || {}), true);
        }
      } catch (e) {}
    })();
    return () => {
      cancelled = true;
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [multiplayerOn, CAN_MULTIPLAYER, storageLoaded, roomCode]);

  // [3] 변경 사항 저장: 항상 내 기기에 백업하고, 멀티플레이 중이면 이 방의 공유 저장소에도 반영합니다.
  useEffect(() => {

    const payload = {
      islandName, characters, relationships, eventLog, newsLog, turn,
      pendingRequests, namingBaby, babyNameInput, assigningJob, jobInput, godItems, islandStartYear,

  }, [storageLoaded, multiplayerOn, roomCode, islandName, characters, relationships, eventLog, newsLog, turn, pendingRequests, namingBaby, babyNameInput, assigningJob, jobInput, godItems, islandStartYear]);

        const ta = document.createElement("textarea");
        ta.value = text;

        ta.select();

      setCharacters((prev) =>

        : TALK_RESPONSES[randInt(0, TALK_RESPONSES.length - 1)];
    const msg = talkMessage.trim();
    setCharacters((prev) => prev.map((c) => (c.id === talkTargetId ? { ...c, loneliness: Math.max(0, c.loneliness - 30) } : c)));
    setEventLog((prev) =>
      [`🌟 [신의 목소리] ${playerName || "당신"} → ${target.name}: "${msg}"  💬 ${target.name}: "${response}"`, ...prev].slice(0, 100)
    );
    setTalkMessage("");
  };

  const giveItem = (item) => {
    if (!giftTargetId) return;
    const target = characters.find((c) => c.id === giftTargetId);
    if (!target) return;

    if (!item.needsTarget) {
      if (item.type === "hunger") {
        setCharacters((prev) => prev.map((c) => (c.id === giftTargetId ? { ...c, hunger: Math.max(0, c.hunger - item.amount) } : c)));
      } else if (item.type === "loneliness") {
        setCharacters((prev) => prev.map((c) => (c.id === giftTargetId ? { ...c, loneliness: Math.max(0, c.loneliness - item.amount) } : c)));
      } else if (item.type === "luck") {
        setCharacters((prev) => prev.map((c) => (c.id === giftTargetId ? { ...c, luckyTurns: 3 } : c)));
      }
      setEventLog((prev) =>
        [`🎁 [신의 선물] ${playerName || "당신"}이(가) ${target.name}에게 ${item.icon} ${item.label}을(를) 선물했습니다. ${target.name}가 매우 기뻐합니다!`, ...prev].slice(0, 100)
      );
    } else {
      if (!giftSecondTargetId || giftSecondTargetId === giftTargetId) return;
      const partnerChar = characters.find((c) => c.id === giftSecondTargetId);
      if (!partnerChar) return;
      const key = relKey(giftTargetId, giftSecondTargetId);
      if (item.type === "relationship") {
        setRelationships((prev) => {
          const cur = prev[key] || { score: 0, status: "지인" };
          const newScore = Math.min(100, cur.score + item.amount);
          const newStatus = statusFromScore(newScore, cur.status);
          return { ...prev, [key]: { ...cur, score: newScore, status: newStatus } };
        });
        setEventLog((prev) =>
          [
            `🎁 [신의 선물] ${playerName || "당신"}이(가) ${target.name}에게 ${item.icon} ${item.label}을(를) 주며 ${partnerChar.name}과(와)의 사이를 축복했습니다! (호감도 +${item.amount})`,
            ...prev,
          ].slice(0, 100)
        );
      } else if (item.type === "reconcile") {
        setRelationships((prev) => {
          const cur = prev[key] || { score: 0, status: "지인" };
          const newScore = Math.max(cur.score, 0);
          const newStatus = statusFromScore(newScore, cur.status);
          return { ...prev, [key]: { ...cur, score: newScore, status: newStatus } };
        });
        setEventLog((prev) =>
          [`🕊️ [신의 중재] ${playerName || "당신"}이(가) ${target.name}와(과) ${partnerChar.name} 사이의 앙금을 씻어주었습니다.`, ...prev].slice(0, 100)
        );
      }
    }
    setGiftSecondTargetId("");
  };

  const addCustomItem = () => {
    const label = customItemLabel.trim();
    if (!label) return;
    const needsTarget = customItemType === "relationship" || customItemType === "reconcile";
    const desc =
      customItemType === "hunger"
        ? `배고픔 -${customItemAmount}`
        : customItemType === "loneliness"
        ? `외로움 -${customItemAmount}`
        : customItemType === "luck"
        ? "3턴 동안 상호작용이 잘 풀려요"
        : customItemType === "relationship"
        ? `지목한 상대와 호감도 +${customItemAmount}`
        : "마이너스 호감도를 0으로 씻어줘요";
    const newItem = {
      id: `custom-${Date.now()}`,
      icon: customItemIcon.trim() || "🎁",
      label,
      desc,
      type: customItemType,
      amount: customItemAmount,
      needsTarget,
      custom: true,
    };
    setGodItems((prev) => [...prev, newItem]);
    setCustomItemLabel("");
  };

  const removeCustomItem = (id) => {
    setGodItems((prev) => prev.filter((i) => i.id !== id));
  };

  const resolveRequest = (requestId, approve) => {
    const req = pendingRequests.find((r) => r.id === requestId);
    if (!req) return;
    const a = characters.find((c) => c.id === req.aId);
    const b = characters.find((c) => c.id === req.bId);

    if (req.type === "confess") {
      if (approve && a && b) {
        setCharacters((prev) =>
          prev.map((c) =>
            c.id === req.aId
              ? { ...c, partner: req.bId, heartbroken: false }
              : c.id === req.bId
              ? { ...c, partner: req.aId, heartbroken: false }
              : c
          )
        );
        setRelationships((prev) => {
          const key = relKey(req.aId, req.bId);
          const cur = prev[key] || { score: 0, status: "지인" };
          return { ...prev, [key]: { ...cur, status: "연인" } };
        });
        setEventLog((prev) => [`💖 [신의 축복] ${playerName || "당신"}의 허락으로 ${a.name}와(과) ${b.name}가 연인이 되었습니다!`, ...prev].slice(0, 100));
        setNewsLog((prev) => [...prev, { text: `🎉 축하합니다! ${a.name}님과 ${b.name}님이 연애를 시작했습니다! (Turn ${turn})`, category: "romance" }].slice(-NEWS_LOG_MAX));
        setPendingRequests((prev) =>
          prev.filter((r) => r.id !== requestId && !(r.type === "confess" && (r.aId === req.aId || r.bId === req.aId || r.aId === req.bId || r.bId === req.bId)))
        );
      } else {
        if (a && b) {
          setRelationships((prev) => {
            const key = relKey(req.aId, req.bId);
            const cur = prev[key] || { score: 0, status: "지인" };
            return { ...prev, [key]: { ...cur, score: Math.max(-100, cur.score - 15), confessCooldownUntilTurn: turn + REQUEST_COOLDOWN } };
          });
          setEventLog((prev) => [`🙅 [신의 뜻] ${playerName || "당신"}은(는) ${a.name}와(과) ${b.name}의 고백을 허락하지 않았습니다.`, ...prev].slice(0, 100));
        }
        setPendingRequests((prev) => prev.filter((r) => r.id !== requestId));
      }
    } else if (req.type === "marriage") {
      if (approve && a && b) {
        setRelationships((prev) => {
          const key = relKey(req.aId, req.bId);
          const cur = prev[key] || { score: 0, status: "연인" };
          return { ...prev, [key]: { ...cur, status: "결혼" } };
        });
        setEventLog((prev) => [`🎊 [신의 축복] ${playerName || "당신"}의 허락으로 ${a.name}와(과) ${b.name}가 결혼식을 올렸습니다!`, ...prev].slice(0, 100));
        setNewsLog((prev) => [...prev, { text: `💒 축하합니다! ${a.name}님과 ${b.name}님이 결혼했습니다! (Turn ${turn})`, category: "romance" }].slice(-NEWS_LOG_MAX));
      } else if (a && b) {
        setRelationships((prev) => {
          const key = relKey(req.aId, req.bId);
          const cur = prev[key] || { score: 0, status: "연인" };
          return { ...prev, [key]: { ...cur, score: Math.max(-100, cur.score - 5), marriageCooldownUntilTurn: turn + REQUEST_COOLDOWN } };
        });
        setEventLog((prev) => [`🙅 [신의 뜻] ${playerName || "당신"}은(는) ${a.name}와(과) ${b.name}의 결혼을 아직 허락하지 않았습니다.`, ...prev].slice(0, 100));
      }
      setPendingRequests((prev) => prev.filter((r) => r.id !== requestId));
    } else if (req.type === "child") {
      setPendingRequests((prev) => prev.filter((r) => r.id !== requestId));
      if (approve && a && b) {
        setNamingBaby({ aId: req.aId, bId: req.bId, aName: a.name, bName: b.name });
        setBabyNameInput(BABY_NAMES[randInt(0, BABY_NAMES.length - 1)]);
      } else if (a && b) {
        setRelationships((prev) => {
          const key = relKey(req.aId, req.bId);
          const cur = prev[key] || { score: 0, status: "결혼" };
          return { ...prev, [key]: { ...cur, childCooldownUntilTurn: turn + REQUEST_COOLDOWN } };
        });
        setEventLog((prev) => [`🙅 [신의 뜻] ${playerName || "당신"}은(는) ${a.name}와(과) ${b.name}의 아이 요청을 미루었습니다.`, ...prev].slice(0, 100));
      }
    } else if (req.type === "breakup" || req.type === "divorce") {
      setPendingRequests((prev) => prev.filter((r) => r.id !== requestId));
      const isDivorce = req.type === "divorce";
      if (approve && a && b) {
        setCharacters((prev) =>
          prev.map((c) =>
            c.id === req.aId
              ? { ...c, partner: null, heartbroken: true, loneliness: 100 }
              : c.id === req.bId
              ? { ...c, partner: null, heartbroken: true, loneliness: 100 }
              : c
          )
        );
        setRelationships((prev) => {
          const key = relKey(req.aId, req.bId);
          const cur = prev[key] || { score: 0, status: isDivorce ? "결혼" : "연인" };
          return { ...prev, [key]: { ...cur, status: isDivorce ? "이혼" : "이별", score: Math.min(cur.score, -10) } };
        });
        setEventLog((prev) =>
          [
            isDivorce
              ? `💔 [신의 뜻] ${playerName || "당신"}의 허락으로 ${a.name}와(과) ${b.name}가 이혼했습니다.`
              : `💔 [신의 뜻] ${playerName || "당신"}의 허락으로 ${a.name}와(과) ${b.name}가 헤어졌습니다.`,
            ...prev,
          ].slice(0, 100)
        );
        setNewsLog((prev) =>
          [
            ...prev,
            { text: `${isDivorce ? "💔 " + a.name + "님과 " + b.name + "님이 이혼했습니다." : "💔 " + a.name + "님과 " + b.name + "님이 이별했습니다."} (Turn ${turn})`, category: "romance" },
          ].slice(-NEWS_LOG_MAX)
        );
      } else if (a && b) {
        setRelationships((prev) => {
          const key = relKey(req.aId, req.bId);
          const cur = prev[key] || { score: 0, status: isDivorce ? "결혼" : "연인" };
          return { ...prev, [key]: { ...cur, score: Math.max(cur.score, -15), breakupCooldownUntilTurn: turn + REQUEST_COOLDOWN } };
        });
        setEventLog((prev) =>
          [`🙅 [신의 뜻] ${playerName || "당신"}은(는) ${a.name}와(과) ${b.name}가 갈라서는 것을 허락하지 않았습니다. 두 사람은 다시 마음을 다잡아보기로 했습니다.`, ...prev].slice(0, 100)
        );
      }
    }
  };

  const rerollBabyName = () => {
    setBabyNameInput(BABY_NAMES[randInt(0, BABY_NAMES.length - 1)]);
  };

  const confirmJob = () => {
    if (!assigningJob) return;
    const job = jobInput.trim() || "무직";
    setCharacters((prev) => prev.map((c) => (c.id === assigningJob.aId ? { ...c, job } : c)));
    setEventLog((prev) =>
      [`💼 [${playerName || "신"}의 뜻] ${assigningJob.aName}가 성인이 되어 '${job}' 이(가) 되었습니다!`, ...prev].slice(0, 100)
    );
    setAssigningJob(null);
    setJobInput("");
  };

  const confirmBabyName = () => {
    if (!namingBaby) return;
    const name = babyNameInput.trim() || BABY_NAMES[randInt(0, BABY_NAMES.length - 1)];
    const a = characters.find((c) => c.id === namingBaby.aId);
    const b = characters.find((c) => c.id === namingBaby.bId);
    if (!a || !b) {
      setNamingBaby(null);
      setBabyNameInput("");
      return;
    }
    const babyId = `m-${Date.now()}-${Math.floor(Math.random() * 1000)}`;
    const parentTypes = Array.from(new Set([...(a.personalityTypes || []), ...(b.personalityTypes || [])]));
    const baby = {
      id: babyId,
      name,
      personalityTypes: parentTypes.length > 0 ? parentTypes.slice(0, 4) : ["평범한"],
      sociability: Math.min(1, Math.max(0, (a.sociability + b.sociability) / 2 + (Math.random() * 0.2 - 0.1))),
      emotional: Math.min(1, Math.max(0, (a.emotional + b.emotional) / 2 + (Math.random() * 0.2 - 0.1))),
      hunger: randInt(10, 30),
      loneliness: randInt(10, 30),
      partner: null,
      luckyTurns: 0,
      note: "",
      keywords: Array.from(new Set([...(a.keywords || []), ...(b.keywords || [])])).slice(0, 8),
      age: 0,
      generation: Math.max(a.generation || 1, b.generation || 1) + 1,
      parentIds: [a.id, b.id],
      job: null,
      alive: true,
      birthday: dayOfYearAt(turn + 1),
      heartbroken: false,
      deathAge: null,
      deathYear: null,
      deathTurn: null,
      gender: Math.random() < 0.5 ? "male" : "female",
      orientation: "hetero",
      justHadBirthday: false,
    };
    setCharacters((prev) => [...prev, baby]);
    setRelationships((prev) => {
      const next = { ...prev };
      const key = relKey(namingBaby.aId, namingBaby.bId);
      const cur = next[key] || { score: 0, status: "결혼" };
      next[key] = { ...cur, hadChild: true };
      next[relKey(namingBaby.aId, babyId)] = { score: 100, status: "부모자식" };
      next[relKey(namingBaby.bId, babyId)] = { score: 100, status: "부모자식" };
      characters.forEach((sib) => {
        if (sib.parentIds && sib.parentIds.includes(a.id) && sib.parentIds.includes(b.id)) {
          next[relKey(sib.id, babyId)] = { score: 80, status: "형제자매" };
        }
      });
      return next;
    });
    setEventLog((prev) =>
      [`👶 [신의 축복] ${playerName || "당신"}이(가) 지어준 이름 '${name}'을(를) 가진 아기가 ${a.name}와(과) ${b.name} 사이에서 태어났습니다!`, ...prev].slice(0, 100)
    );
    setNewsLog((prev) => [...prev, { text: `👶✨ 2세 탄생! ${a.name}님과 ${b.name}님이 부모가 되어 '${name}'을(를) 맞이했습니다! (Turn ${turn})`, category: "romance" }].slice(-NEWS_LOG_MAX));
    setNamingBaby(null);
    setBabyNameInput("");
  };

  const step = () => {
    if (characters.length === 0) return;
    if (pendingRequests.length > 0 || namingBaby || assigningJob) return;

    const charsById = {};
    characters.forEach((c) => (charsById[c.id] = { ...c }));
    const relMap = {};
    Object.entries(relationships).forEach(([k, v]) => (relMap[k] = { ...v }));
    const log = [];
    const news = [...newsLog];
    const newRequests = [];
    const pendingSnapshot = pendingRequests;

    const getRel = (a, b) => relMap[relKey(a, b)] || { score: 0, status: "지인" };
    const setRel = (a, b, obj) => {
      relMap[relKey(a, b)] = obj;
    };
    const hasPendingFor = (type, x, y) =>
      pendingSnapshot.some((p) => p.type === type && ((p.aId === x && p.bId === y) || (p.aId === y && p.bId === x))) ||
      newRequests.some((p) => p.type === type && ((p.aId === x && p.bId === y) || (p.aId === y && p.bId === x)));

    const updateRelationshipStatus = (aId, bId) => {
      const a = charsById[aId];
      const b = charsById[bId];
      const r = getRel(aId, bId);
      const newStatus = statusFromScore(r.score, r.status);
      if (newStatus !== r.status) {
        setRel(aId, bId, { ...r, status: newStatus });
        log.push(`✨ [관계 변화] ${a.name}과(와) ${b.name}의 관계가 '${newStatus}'가 되었습니다!`);
      }
    };

    const interact = (aId, bId) => {
      const a = charsById[aId];
      const b = charsById[bId];
      const r = getRel(aId, bId);
      const compatibility = 1 - Math.abs(a.sociability - b.sociability);
      const luckyBonus = a.luckyTurns > 0 ? 0.2 : 0;
      const sharedInterests = (a.keywords || []).filter((k) => (b.keywords || []).includes(k));
      const interestBonus = sharedInterests.length > 0 ? 0.15 : 0;
      const successChance = 0.5 + r.score / 200 + compatibility * 0.2 - a.emotional * 0.1 + luckyBonus + interestBonus;

      a.loneliness = Math.max(0, a.loneliness - 30);
      b.loneliness = Math.max(0, b.loneliness - 20);

      if (Math.random() < successChance) {
        let delta = randInt(8, 15);
        let useTopic = false;
        let topic = null;
        if (sharedInterests.length > 0 && Math.random() < 0.5) {
          topic = sharedInterests[randInt(0, sharedInterests.length - 1)];
          delta += 5;
          useTopic = true;
        }
        const newScore = Math.min(100, r.score + delta);
        setRel(aId, bId, { ...r, score: newScore, status: r.status });
        log.push(
          useTopic
            ? `💫 ${a.name}와(과) ${b.name}는 서로 적어둔 '${topic}' 이야기로 더욱 가까워졌습니다! (호감도 +${delta} → 현재: ${newScore})`
            : `💬 ${a.name}가 ${b.name}에게 유쾌한 이야기를 건넸습니다. (호감도 +${delta} → 현재: ${newScore})`
        );
        updateRelationshipStatus(aId, bId);
        const r2 = getRel(aId, bId);
        if (r2.score >= 80 && !a.partner && !b.partner && !isFamilyStatus(r2.status) && mutuallyAttracted(a, b)) {
          const cooldownOk = !(r2.confessCooldownUntilTurn && turn + 1 < r2.confessCooldownUntilTurn);
          if (cooldownOk && !hasPendingFor("confess", aId, bId) && Math.random() < 0.5) {
            newRequests.push({ id: `req-${Date.now()}-${Math.floor(Math.random() * 10000)}`, type: "confess", aId, bId });
            log.push(`❓ [신의 뜻을 묻습니다] ${a.name}가 ${b.name}에게 마음이 생겼어요. 사귀어도 될지 여쭤봅니다...`);
            setRel(aId, bId, { ...r2, confessCooldownUntilTurn: turn + 1 + REQUEST_COOLDOWN });
          }
        } else if (a.partner === bId && r2.status === "연인" && r2.score >= 90) {
          const cooldownOk = !(r2.marriageCooldownUntilTurn && turn + 1 < r2.marriageCooldownUntilTurn);
          if (cooldownOk && !hasPendingFor("marriage", aId, bId) && Math.random() < 0.35) {
            newRequests.push({ id: `req-${Date.now()}-${Math.floor(Math.random() * 10000)}`, type: "marriage", aId, bId });
            log.push(`❓ [신의 뜻을 묻습니다] ${a.name}와(과) ${b.name}가 결혼해도 될지 여쭤봅니다...`);
            setRel(aId, bId, { ...r2, marriageCooldownUntilTurn: turn + 1 + REQUEST_COOLDOWN });
          }
        }
      } else {
        const delta = randInt(8, 15);
        const newScore = Math.max(-100, r.score - delta);
        setRel(aId, bId, { ...r, score: newScore, status: r.status });
        log.push(`💥 ${a.name}와(과) ${b.name}가 성격 차이로 말다툼을 했습니다! (호감도 -${delta} → 현재: ${newScore})`);
        updateRelationshipStatus(aId, bId);
      }
    };

    const ids = characters.map((c) => c.id);
    const nextTurn = turn + 1;
    const dateNow = calendarAt(nextTurn, islandStartYear);
    const today = dateNow.doy;
    const thisYear = dateNow.year;
    const aliveIds = ids.filter((id) => charsById[id].alive !== false);
    const newlyDeceased = [];
    const birthdayFolks = [];

    aliveIds.forEach((id) => {
      const c = charsById[id];
      c.hunger = Math.min(100, c.hunger + randInt(5, 12));
      c.luckyTurns = Math.max(0, (c.luckyTurns || 0) - 1);
      if (c.heartbroken) {
        c.loneliness = 100;
      } else {
        c.loneliness = Math.min(100, c.loneliness + randInt(5, 15));
      }
      c.justHadBirthday = false;
      if (c.birthday === today) {
        c.age = (c.age || 0) + 1;
        c.justHadBirthday = true;
        birthdayFolks.push(c);
        log.push(`🎂 [생일] ${c.name}가 ${c.age}번째 생일을 맞았습니다!`);
        news.push({ text: `🎂 ${c.name}님이 ${c.age}번째 생일을 맞았습니다! (Turn ${nextTurn})`, category: "other" });
      }
      if (Math.random() < 0.05) {
        const eventFn = QUIRKY_EVENTS[randInt(0, QUIRKY_EVENTS.length - 1)];
        const text = eventFn(c.name);
        log.push(text);
        if (Math.random() < 0.4) news.push({ text, category: "other" });
      }
      const willDieByAge = c.deathAge != null && c.age >= c.deathAge;
      const willDieByYear = c.deathYear != null && thisYear >= c.deathYear;
      if (willDieByAge || willDieByYear) {
        c.alive = false;
        c.deathTurn = nextTurn;
        c.deathAge = c.age;
        c.deathYear = thisYear;
        newlyDeceased.push(c);
      }
    });

    // 사망 처리: 배우자/연인은 사별로, 부고를 알립니다.
    newlyDeceased.forEach((dead) => {
      log.push(`🕊️ [부고] ${dead.name}가 ${dead.age}세로 세상을 떠났습니다. 그동안 함께해주셔서 감사했습니다.`);
      news.push({ text: `🕊️ ${dead.name}님이 ${dead.age}세를 일기로 세상을 떠났습니다. (Turn ${nextTurn})`, category: "other" });
      if (dead.partner && charsById[dead.partner] && charsById[dead.partner].alive !== false) {
        const spouse = charsById[dead.partner];
        spouse.partner = null;
        spouse.heartbroken = true;
        spouse.loneliness = 100;
        const key = relKey(dead.id, spouse.id);
        const cur = getRel(dead.id, spouse.id);
        setRel(dead.id, spouse.id, { ...cur, status: "사별" });
        log.push(`💐 ${spouse.name}가 ${dead.name}를(을) 떠나보내고 깊은 슬픔에 잠겼습니다.`);
      }
    });

    const aliveAfterDeaths = aliveIds.filter((id) => charsById[id].alive !== false);

    // 추억 시스템: 살아있는 주민이 세상을 떠난 인연을 떠올립니다.
    if (aliveAfterDeaths.length > 0 && Math.random() < 0.06) {
      const candidates = [];
      aliveAfterDeaths.forEach((id) => {
        ids.forEach((otherId) => {
          if (otherId === id) return;
          const other = charsById[otherId];
          if (other.alive === false) {
            const r = getRel(id, otherId);
            if (r.status && r.status !== "지인") {
              candidates.push({ id, deadId: otherId, status: r.status });
            }
          }
        });
      });
      if (candidates.length > 0) {
        const pick = candidates[randInt(0, candidates.length - 1)];
        const who = charsById[pick.id];
        const dead = charsById[pick.deadId];
        const tpl = MEMORY_TEMPLATES[randInt(0, MEMORY_TEMPLATES.length - 1)];
        log.push(tpl(who.name, dead.name, relLabelFor(pick.status)));
      }
    }

    shuffled(aliveAfterDeaths).forEach((id) => {
      const c = charsById[id];
      if (c.hunger >= 75) {
        c.hunger -= 60;
        log.push(`🍛 ${c.name}가 식당에서 밥을 맛있게 먹었습니다.`);
        return;
      }
      if (c.loneliness >= 40 && Math.random() < c.sociability) {
        const others = aliveAfterDeaths.filter((x) => x !== id);
        if (others.length) {
          const targetId = others[randInt(0, others.length - 1)];
          interact(id, targetId);
        }
      }
    });

    // 사이가 나빠진 연인·부부는 이별·이혼을 신께 여쭤봅니다.
    const troubledCouples = [];
    for (let i = 0; i < aliveAfterDeaths.length; i++) {
      for (let j = i + 1; j < aliveAfterDeaths.length; j++) {
        const rr = getRel(aliveAfterDeaths[i], aliveAfterDeaths[j]);
        if ((rr.status === "연인" || rr.status === "결혼") && rr.score <= BREAKUP_SCORE_THRESHOLD) {
          troubledCouples.push([aliveAfterDeaths[i], aliveAfterDeaths[j], rr.status]);
        }
      }
    }
    shuffled(troubledCouples).forEach(([aId, bId, status]) => {
      const rr = getRel(aId, bId);
      const reqType = status === "결혼" ? "divorce" : "breakup";
      if (rr.breakupCooldownUntilTurn && nextTurn < rr.breakupCooldownUntilTurn) return;
      if (hasPendingFor(reqType, aId, bId)) return;
      if (Math.random() < 0.25) {
        const a = charsById[aId];
        const b = charsById[bId];
        newRequests.push({ id: `req-${Date.now()}-${Math.floor(Math.random() * 10000)}`, type: reqType, aId, bId });
        log.push(
          reqType === "divorce"
            ? `❓ [신의 뜻을 묻습니다] ${a.name}와(과) ${b.name}의 사이가 나빠져 이혼을 고민 중입니다...`
            : `❓ [신의 뜻을 묻습니다] ${a.name}와(과) ${b.name}의 사이가 나빠져 헤어짐을 고민 중입니다...`
        );
        setRel(aId, bId, { ...rr, breakupCooldownUntilTurn: nextTurn + REQUEST_COOLDOWN });
      }
    });

    const marriedPairs = [];
    for (let i = 0; i < aliveAfterDeaths.length; i++) {
      for (let j = i + 1; j < aliveAfterDeaths.length; j++) {
        const rr = getRel(aliveAfterDeaths[i], aliveAfterDeaths[j]);
        if (rr.status === "결혼") marriedPairs.push([aliveAfterDeaths[i], aliveAfterDeaths[j]]);
      }
    }
    shuffled(marriedPairs).forEach(([aId, bId]) => {
      const rr = getRel(aId, bId);
      if (rr.childCooldownUntilTurn && nextTurn < rr.childCooldownUntilTurn) return;
      if (hasPendingFor("child", aId, bId)) return;
      if (Math.random() < 0.18) {
        const a = charsById[aId];
        const b = charsById[bId];
        newRequests.push({ id: `req-${Date.now()}-${Math.floor(Math.random() * 10000)}`, type: "child", aId, bId });
        log.push(`❓ [신의 뜻을 묻습니다] ${a.name}와(과) ${b.name}가 아이를 가져도 될지 여쭤봅니다...`);
        setRel(aId, bId, { ...rr, childCooldownUntilTurn: nextTurn + REQUEST_COOLDOWN });
      }
    });

    setCharacters(ids.map((id) => charsById[id]));
    setRelationships(relMap);
    setNewsLog(news.slice(-NEWS_LOG_MAX));
    setEventLog((prev) => [...log.reverse(), ...prev].slice(0, 100));
    setTurn((t) => t + 1);
    if (newRequests.length > 0) {
      setPendingRequests((prev) => [...prev, ...newRequests]);
    }
    // 생일이 된 주민이 있으면 자동재생을 멈춰서 생일 파티를 챙길 수 있게 해줍니다.
    if (birthdayFolks.length > 0) {
      setAutoPlay(false);
    }
    const adultNeedingJob = aliveAfterDeaths.map((id) => charsById[id]).find((c) => c.age >= ADULT_AGE && c.job === null);
    if (adultNeedingJob) {
      setAssigningJob({ aId: adultNeedingJob.id, aName: adultNeedingJob.name });
      setJobInput("");
    }
  };

  const throwBirthdayParty = (charId) => {
    const person = characters.find((c) => c.id === charId);
    if (!person) return;
    setCharacters((prev) =>
      prev.map((c) => (c.alive !== false ? { ...c, loneliness: Math.max(0, c.loneliness - 25), justHadBirthday: c.id === charId ? false : c.justHadBirthday } : c))
    );
    setRelationships((prev) => {
      const next = { ...prev };
      characters
        .filter((c) => c.alive !== false && c.id !== charId)
        .forEach((c) => {
          const key = relKey(charId, c.id);
          const cur = next[key] || { score: 0, status: "지인" };
          const newScore = Math.min(100, cur.score + 5);
          next[key] = { ...cur, score: newScore, status: statusFromScore(newScore, cur.status) };
        });
      return next;
    });
    setEventLog((prev) =>
      [`🎉 [생일 파티] ${playerName || "당신"}이(가) ${person.name}의 ${person.age}번째 생일을 맞아 성대한 파티를 열어주었습니다! 모두가 즐거워합니다.`, ...prev].slice(0, 100)
    );
    setNewsLog((prev) => [...prev, { text: `🎂 ${person.name}님의 ${person.age}번째 생일 파티가 열렸습니다! (Turn ${turn})`, category: "other" }].slice(-NEWS_LOG_MAX));
  };

  const sendOnOuting = () => {
    if (!outingAId || !outingBId || outingAId === outingBId) return;
    const a = characters.find((c) => c.id === outingAId);
    const b = characters.find((c) => c.id === outingBId);
    const place = PLACES.find((p) => p.id === outingPlaceId) || PLACES[0];
    if (!a || !b) return;
    const key = relKey(outingAId, outingBId);
    const cur = relationships[key] || { score: 0, status: "지인" };
    const lineFn = OUTING_LINES[place.id] || (() => `${a.name}와(과) ${b.name}가 ${place.name}에 함께 다녀왔습니다.`);
    let delta;
    if (place.kind === "reconcile") {
      delta = cur.score < 0 ? randInt(15, 30) : randInt(5, 12);
    } else {
      delta = randInt(8, 18);
    }
    const newScore = Math.min(100, cur.score + delta);
    const newStatus = statusFromScore(newScore, cur.status);
    setRelationships((prev) => ({ ...prev, [key]: { ...cur, score: newScore, status: newStatus } }));
    setCharacters((prev) =>
      prev.map((c) =>
        c.id === outingAId || c.id === outingBId
          ? { ...c, loneliness: Math.max(0, c.loneliness - 25), hunger: place.id === "restaurant" ? Math.max(0, c.hunger - 40) : c.hunger }
          : c
      )
    );
    setEventLog((prev) =>
      [
        `${place.icon} [${place.name}] ${lineFn(a.name, b.name)} (호감도 +${delta} → 현재: ${newScore}${newStatus !== cur.status ? `, 관계: '${newStatus}'` : ""})`,
        ...prev,
      ].slice(0, 100)
    );
  };

  const openEditChar = (c) => {
    setEditingCharId(c.id);
    setEditName(c.name);
    setEditTypes(c.personalityTypes || []);
    setEditCustomType("");
    setEditNote(c.note || "");
    setEditSoc(Math.round((c.sociability || 0) * 100));
    setEditEmo(Math.round((c.emotional || 0) * 100));
    setEditAge(c.age ?? 0);
    setEditJob(c.job || "");
    const bd = dayOfYearToMonthDay(c.birthday || 1);
    setEditBirthMonth(bd.month);
    setEditBirthDay(bd.day);
    setEditDeathAge(c.deathAge != null ? c.deathAge : "");
    setEditDeathYear(c.deathYear != null ? c.deathYear : "");
    setEditGender(c.gender || "male");
    setEditOrientation(c.orientation || "hetero");
  };

  const closeEditChar = () => setEditingCharId(null);

  const saveEditChar = () => {
    if (!editingCharId) return;
    const nm = editName.trim();
    if (!nm) return;
    const types = [...editTypes];
    if (editCustomType.trim()) types.push(editCustomType.trim());
    setCharacters((prev) =>
      prev.map((c) =>
        c.id === editingCharId
          ? {
              ...c,
              name: nm,
              personalityTypes: types.length > 0 ? Array.from(new Set(types)) : ["평범한"],
              note: editNote.trim(),
              keywords: extractKeywords(editNote.trim()),
              sociability: editSoc / 100,
              emotional: editEmo / 100,
              age: Math.max(0, Number(editAge) || 0),
              job: editJob.trim() || null,
              birthday: monthDayToDayOfYear(editBirthMonth, editBirthDay),
              deathAge: editDeathAge === "" ? null : Math.max(0, Number(editDeathAge) || 0),
              deathYear: editDeathYear === "" ? null : Math.max(1, Number(editDeathYear) || 1),
              gender: editGender,
              orientation: editOrientation,
            }
          : c
      )
    );
    setEventLog((prev) => [`🔧 [주민 수정] ${playerName || "당신"}이(가) ${nm}의 정보를 수정했습니다.`, ...prev].slice(0, 100));
    setEditingCharId(null);
  };

  const markDeadNow = () => {
    if (!editingCharId) return;
    const c = characters.find((x) => x.id === editingCharId);
    if (!c) return;
    setCharacters((prev) =>
      prev.map((ch) => {
        if (ch.id === editingCharId) {
          return { ...ch, alive: false, deathTurn: turn, deathAge: ch.age, deathYear: calendarAt(turn, islandStartYear).year };
        }
        if (ch.partner === editingCharId) {
          return { ...ch, partner: null, heartbroken: true, loneliness: 100 };
        }
        return ch;
      })
    );
    if (c.partner) {
      setRelationships((prev) => {
        const key = relKey(c.id, c.partner);
        const cur = prev[key] || { score: 0, status: "결혼" };
        return { ...prev, [key]: { ...cur, status: "사별" } };
      });
    }
    setEventLog((prev) => [`🕊️ [부고] ${playerName || "당신"}의 뜻으로 ${c.name}가 세상을 떠났습니다.`, ...prev].slice(0, 100));
    setEditingCharId(null);
  };

  useEffect(() => {
    if (!autoPlay) return;
    if (pendingRequests.length > 0 || namingBaby || assigningJob) return;
    const id = setInterval(() => {
      step();
    }, AUTOPLAY_MS);
    return () => clearInterval(id);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [autoPlay, characters, relationships, newsLog, turn, pendingRequests, namingBaby, assigningJob]);

  const livingCharacters = characters.filter((c) => c.alive !== false);
  const deceasedCharacters = characters.filter((c) => c.alive === false);

  const pairList = [];
  for (let i = 0; i < livingCharacters.length; i++) {
    for (let j = i + 1; j < livingCharacters.length; j++) {
      const a = livingCharacters[i];
      const b = livingCharacters[j];
      const r = relationships[relKey(a.id, b.id)] || { score: 0, status: "지인" };
      pairList.push({ a, b, r });
    }
  }
  pairList.sort((x, y) => y.r.score - x.r.score);

  const marriageCount = pairList.filter((p) => p.r.status === "결혼").length;
  const romanceNews = newsLog.filter((n) => n.category === "romance");
  const otherNews = newsLog.filter((n) => n.category === "other");
  const babyCount = romanceNews.filter((n) => n.text.includes("2세 탄생")).length;
  const talkTargetName = characters.find((c) => c.id === talkTargetId)?.name;
  const isPaused = pendingRequests.length > 0 || !!namingBaby || !!assigningJob;
  const selectedChar = characters.find((c) => c.id === selectedCharId);
  const displayedPairs = selectedCharId ? pairList.filter((p) => p.a.id === selectedCharId || p.b.id === selectedCharId) : pairList;
  const displayIslandName = islandName.trim() || "우리 섬";
  const editingChar = characters.find((c) => c.id === editingCharId);
  const currentDate = calendarAt(turn, islandStartYear);

  return (
    <div className="app">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');

          --ink-soft: #82686e;
          --line: #eddce1;
          --accent: #d1517a;
          --accent-soft: #fbe6ec;
          --good: #2f8f7c;
          --good-soft: #e2f2ee;
          --gold: #c99a3b;
          --gold-soft: #f7edd9;
          --warn: #c0463a;
          --warn-soft: #f7e6e3;
          --love: #e0607b;
          --marriage: #a8447a;
          --family: #4f9d6e;
          --hunger: #e0954f;
          --loneliness: #5a7fd6;
        }
        * { box-sizing: border-box; }
        .app { font-family: 'Noto Sans KR', sans-serif; color: var(--ink); background: var(--bg); min-height: 100%; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

        .site-title-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .site-title { font-weight: 800; font-size: 19px; }
        .island-name-input { font-weight: 800; font-size: 15px; border: none; border-bottom: 2px solid var(--line); text-align: center; background: transparent; padding: 2px 4px; }
        .island-name-input:focus { outline: none; border-color: var(--accent); }
        .site-tagline { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
        .year-set-row { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-soft); }

        .year-set-input { width: 70px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; padding: 4px 6px; border: 1.5px solid var(--line); border-radius: 6px; text-align: center; }

                );
                const spouseId = spouseKey ? spouseKey.split("|").find((x) => x !== c.id) : null;
                const spouse = spouseId ? characters.find((x) => x.id === spouseId) : null;
                return (
                  <div className="r-card memorial-card" key={c.id}>
                    <div className="r-card-name">
                      🕯️ {genderInfo(c.gender).icon} {c.name}
                    </div>
                    <div className="r-card-type">{(c.personalityTypes || []).join(", ") || "평범한"}</div>
                    <div className="r-card-meta">
                      향년 {c.deathAge ?? c.age ?? "?"}세 · {c.deathYear ? `${c.deathYear}년 별세` : ""} · {c.generation || 1}세대
                    </div>
                    {c.note && <div className="r-card-note">{c.note}</div>}
                    {spouse && (
                      <div className="partner-tag" style={{ color: "var(--marriage)" }}>
                        💐 배우자: {spouse.name}
                      </div>
                    )}
                    {parents.length > 0 && (
                      <div className="partner-tag" style={{ color: "var(--family)" }}>
                        👪 부모: {parents.map((f) => f.name).join(", ")}
                      </div>
                    )}
                    {children.length > 0 && (
                      <div className="partner-tag" style={{ color: "var(--family)" }}>
                        🧒 자녀: {children.map((f) => f.name).join(", ")}
                      </div>
                    )}
                    {siblings.length > 0 && (
                      <div className="partner-tag" style={{ color: "var(--family)" }}>
                        🧑‍🤝‍🧑 형제자매: {siblings.map((f) => f.name).join(", ")}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {characters.length >= 2 && (
          <div className="card">
            <div className="section-header-row">
              <h2 className="section-title">💞 {selectedChar ? `${selectedChar.name}의 관계` : "주민 관계도"}</h2>
              {selectedChar && (
                <button className="btn btn-ghost" onClick={() => setSelectedCharId(null)} type="button">
                  전체보기
                </button>
              )}
            </div>
            {displayedPairs.length === 0 ? (
              <div className="empty-state">아직 관계가 없어요.</div>
            ) : (
              <div className="rel-list">
                {displayedPairs.map(({ a, b, r }) => (
                  <div className="rel-item" key={`${a.id}-${b.id}`}>
                    <span className="rel-names">
                      {a.name} ↔ {b.name}
                    </span>
                    <span className="rel-badge" style={{ background: statusColor(r.status) }}>
                      {r.status}
                    </span>
                    <span className="rel-score">{r.score}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {romanceNews.length > 0 && (
          <div className="card">
            <h2 className="section-title">💕 연애 소식</h2>
            <div className="news-list">
              {[...romanceNews].reverse().map((n, i) => (
                <div className="news-line" key={i}>
                  {n.text}
                </div>
              ))}
            </div>
          </div>
        )}

        {otherNews.length > 0 && (
          <div className="card">
            <h2 className="section-title">📰 아일랜드 소식</h2>
            <div className="news-list">
              {[...otherNews].reverse().map((n, i) => (
                <div className="news-line other" key={i}>
                  {n.text}
                </div>
              ))}
            </div>
          </div>
        )}

        <div className="card">
          <div className="section-header-row">
            <h2 className="section-title">📜 이벤트 로그</h2>
            <select
              className="setup-select"
              value={logDisplayLimit}
              onChange={(e) => setLogDisplayLimit(Number(e.target.value))}
              aria-label="로그 최대 표시 개수"
            >
              {LOG_DISPLAY_OPTIONS.map((n) => (
                <option key={n} value={n}>
                  최근 {n}개만 보기
                </option>
              ))}
            </select>
          </div>
          {eventLog.length === 0 ? (
            <div className="empty-state">'다음 턴'을 눌러 시뮬레이션을 진행해보세요.</div>
          ) : (
            <div className="log-list">
              {eventLog.slice(0, logDisplayLimit).map((l, i) => (
                <div className="log-line" key={i}>
                  {l}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MoaIslandSim />);
</script>
</body>
</html>
